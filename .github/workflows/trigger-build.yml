name: Trigger site build

# 内容推送后自动通知代码仓重新构建并发布。
# 需要在本仓库配置 secrets.DISPATCH_TOKEN：
# 一个只对代码仓授予 Contents: Read and write 权限的个人访问令牌（PAT）。
#
# 并发控制：连续快速推送时自动取消旧派发作业，仅保留最新一次触发，避免重复派发。
# 想在合并前预检内容，可增加调用代码仓 .github/workflows/content-validate.yml 的作业。

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "config/**"
      - "data/**"
      - "assets/**"
      - "public/**"
      - "shirone.content.json"
      - ".github/workflows/trigger-build.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: trigger-build
  cancel-in-progress: true

jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify code repository
        timeout-minutes: 2
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.DISPATCH_TOKEN }}
          repository: Zhaozhiii/shirone-Zh
          event-type: content-updated
          # 传 SHA 让代码仓构建「触发它的那次提交」，而不是构建时刻的 main。
          client-payload: '{"sha": "${{ github.sha }}"}'
